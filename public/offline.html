<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koneksi Terputus — Absensi Kelas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #EFF2F9;
      color: #111C2D;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: #FFFFFF;
      max-width: 440px;
      width: 100%;
      border-radius: 24px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 10px 30px rgba(73, 85, 168, 0.12);
      border: 1px solid #DFE2F3;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(237, 137, 54, 0.15);
      color: #C05621;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #DD6B20;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 0.75rem;
      color: #111C2D;
    }
    p {
      font-size: 13px;
      color: #5A5E6C;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px 24px;
      border-radius: 9999px;
      background: #4955A8;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #3B468F;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      <span>Status: Mode Offline</span>
    </div>
    <h1>Tidak Ada Sambungan Internet</h1>
    <p>Aplikasi Absensi Kelas berjalan dalam mode luring (offline). Pastikan koneksi internet kembali aktif untuk menyinkronkan data presensi ke server.</p>
    <button class="btn" onclick="window.location.reload()">Coba Muat Ulang</button>
  </div>
</body>
</html>
