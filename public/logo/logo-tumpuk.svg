<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <!-- Logo Tumpuk Absensi Kelas -->
  <defs>
    <style>
      .wm-dark { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; font-weight: 800; font-size: 38px; fill: #1E293B; letter-spacing: -0.5px; }
      .wm-primary { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; font-weight: 800; font-size: 38px; fill: #6A76CC; letter-spacing: -0.5px; }
      .wm-sub { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #64748B; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Simbol di Tengah Atas -->
  <g transform="translate(118, 15)">
    <path d="M38 74 C26 74 12 70 4 64 L4 26 C14 30 26 32 38 32 Z" fill="#1E293B" />
    <path d="M42 74 C54 74 68 70 76 64 L76 26 C66 30 54 32 42 32 Z" fill="#6A76CC" />
    <rect x="38" y="31" width="4" height="43" rx="2" fill="#5863B5" />
    <path d="M40 23 C30 21 25 11 30 4 C35 9 37 16 40 23 Z" fill="#6A76CC" />
    <path d="M40 23 C50 21 55 11 50 4 C45 9 43 16 40 23 Z" fill="#48BB78" />
  </g>

  <!-- Nama Aplikasi di Bawah Simbol -->
  <g transform="translate(160, 150)" text-anchor="middle">
    <text y="0">
      <tspan class="wm-dark">Absensi </tspan>
      <tspan class="wm-primary">Kelas</tspan>
    </text>
    <text y="28" class="wm-sub">SISTEM PRESENSI RESMI</text>
