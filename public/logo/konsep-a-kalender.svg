<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <!-- Konsep A: Absensi Kelas - Titik 'i' Kalender Ceklis Presensi -->
  <defs>
    <style>
      .text-dark { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; font-weight: 800; font-size: 54px; fill: #1E293B; letter-spacing: -1px; }
      .text-primary { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; font-weight: 800; font-size: 54px; fill: #6A76CC; letter-spacing: -1px; }
    </style>
  </defs>

  <!-- Wordmark 'Absens' -->
  <text x="30" y="82" class="text-dark">Absens</text>

  <!-- Modifikasi Cerdas: Huruf 'i' dengan Titik Lembar Kalender Presensi -->
  <!-- Batang Huruf 'i' -->
  <rect x="241" y="46" width="13" height="36" rx="6" fill="#1E293B" />
  
  <!-- Titik Huruf 'i' = Mini Kalender Ceklis Hadir -->
  <rect x="233" y="14" width="29" height="26" rx="6" fill="#6A76CC" />
  <!-- Gantungan Kalender -->
  <rect x="238" y="10" width="4" height="6" rx="2" fill="#1E293B" />
  <rect x="252" y="10" width="4" height="6" rx="2" fill="#1E293B" />
  <!-- Garis Header Kalender -->
  <rect x="233" y="21" width="29" height="2" fill="#5863B5" />
  <!-- Ceklis Presensi Putih -->
  <path d="M239 29 L245 34 L255 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Wordmark 'Kelas' -->
  <text x="274" y="82" class="text-primary">Kelas</text>
</svg>

