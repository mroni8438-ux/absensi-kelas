<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <!-- Konsep B: Huruf 'A' Cerdas Berbentuk Buku Terbuka & Tunas Prestasi -->
  <defs>
    <style>
      .text-dark { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; font-weight: 800; font-size: 54px; fill: #1E293B; letter-spacing: -1px; }
      .text-primary { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; font-weight: 800; font-size: 54px; fill: #6A76CC; letter-spacing: -1px; }
    </style>
  </defs>

  <!-- Simbol Huruf A Cerdas (Buku Terbuka & Tunas Belajar) -->
  <g transform="translate(25, 20)">
    <!-- Sayap Kiri Buku / Kaki Kiri A -->
    <path d="M30 62 C22 62 10 59 4 54 L4 22 C12 26 22 28 30 28 Z" fill="#1E293B" />
    <!-- Sayap Kanan Buku / Kaki Kanan A -->
    <path d="M34 62 C42 62 54 59 60 54 L60 22 C52 26 42 28 34 28 Z" fill="#6A76CC" />
    <!-- Punggung Buku / Tiang Tengah A -->
    <rect x="30" y="27" width="4" height="35" rx="2" fill="#5863B5" />
    
    <!-- Tunas Daun / Siluet Puncak A -->
    <!-- Daun Kiri -->
    <path d="M32 20 C24 18 20 10 24 4 C28 8 30 14 32 20 Z" fill="#6A76CC" />
    <!-- Daun Kanan -->
    <path d="M32 20 C40 18 44 10 40 4 C36 8 34 14 32 20 Z" fill="#48BB78" />
  </g>

  <!-- Sisa Huruf 'bsensi' -->
  <text x="100" y="82" class="text-dark">bsensi</text>

  <!-- Kata 'Kelas' -->
  <text x="285" y="82" class="text-primary">Kelas</text>
</svg>

