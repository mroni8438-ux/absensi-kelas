<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <!-- Konsep C: Monogram Geometris Cerdas 'AK' Interlocking dengan Ceklis -->
  <defs>
    <style>
      .text-title { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; font-weight: 800; font-size: 40px; fill: #1E293B; letter-spacing: -0.5px; }
      .text-sub { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 24px; fill: #6A76CC; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Simbol Monogram Geometris AK (Interlocking Presence Badge) -->
  <g transform="translate(30, 18)">
    <!-- Bingkai Persegi Membulat Lembut (Squircle) -->
    <rect x="0" y="0" width="84" height="84" rx="22" fill="#6A76CC" />
    
    <!-- Huruf 'A' dan 'K' Terhubung Elegan (Putih Vektor) -->
    <!-- Kaki Kiri A -->
    <path d="M22 62 L36 24 L45 24 L31 62 Z" fill="#FFFFFF" />
    <!-- Batang Bersama (Kanan A / Tiang K) -->
    <rect x="42" y="24" width="9" height="38" rx="4.5" fill="#FFFFFF" />
    <!-- Palang A -->
    <rect x="29" y="45" width="18" height="7" rx="3.5" fill="#FFFFFF" />
    
    <!-- Sayap K Atas & Ceklis Gabungan -->
    <path d="M51 44 L64 26 C66 23 69 25 68 28 L57 44 Z" fill="#FFFFFF" />
    <!-- Sayap K Bawah -->
    <path d="M48 40 L65 60 C67 63 64 65 61 63 L47 47 Z" fill="#FFFFFF" />
    
    <!-- Titik Indikator Kehadiran Aktif (Badge Hijau Hadir) -->
    <circle cx="68" cy="18" r="8" fill="#48BB78" stroke="#FFFFFF" stroke-width="2.5" />
  </g>

  <!-- Wordmark 'ABSENSI' dan 'KELAS' Berjajar -->
  <text x="135" y="58" class="text-title">Absensi</text>
  <text x="295" y="58" class="text-title" fill="#6A76CC" style="fill: #6A76CC;">Kelas</text>
  <!-- Subteks resmi sekolah -->
  <text x="136" y="86" class="text-sub">SISTEM PRESENSI RESMI</text>
</svg>

